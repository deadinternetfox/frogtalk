<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FrogTalk — Disconnected</title>
  <style>
    :root{
      --bg:#060a08;
      --line:#2f5548;
      --card1:rgba(24,40,33,.92);
      --card2:rgba(14,24,19,.92);
      --text:#dff5e8;
      --muted:#85a89a;
      --accent:#7fd2a7;
      --accent2:#4caf50;
      --btn:#2a453b;
      --btn2:#20352d;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:
      radial-gradient(900px 380px at 10% 0%, rgba(76,175,80,.14), transparent 60%),
      radial-gradient(900px 420px at 110% 110%, rgba(111,199,150,.10), transparent 60%),
      linear-gradient(180deg, #12231e 0%, #0a1411 60%, #08110e 100%);
      color:var(--text)}
    body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
    .wrap{
      width:100%;
      max-width:420px;
      border-radius:20px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--card1),var(--card2));
      box-shadow:0 20px 56px rgba(0,0,0,.55), 0 0 0 1px rgba(76,175,80,.06);
      padding:22px 18px 18px;
      text-align:center;
      backdrop-filter:blur(10px);
    }
    .icon{
      font-size:64px;
      line-height:1;
      margin-bottom:12px;
      filter:drop-shadow(0 6px 18px rgba(127,210,167,.22));
    }
    h1{margin:0;font-size:20px;letter-spacing:.2px}
    .msg{margin:10px auto 0;max-width:340px;color:var(--muted);font-size:13px;line-height:1.45}
    .sub{margin:10px auto 0;max-width:340px;color:#9bbab0;font-size:12px;min-height:18px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
    button{
      appearance:none;border:1px solid #2f5548;border-radius:12px;
      background:linear-gradient(180deg, rgba(127,210,167,.08), rgba(76,175,80,.05));
      color:var(--accent);
      padding:12px 14px;
      min-width:120px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 28px rgba(0,0,0,.28);
    }
    button.secondary{
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      color:#b7d9cb;
      border-color:#2a4038;
    }
    button:active{transform:scale(.99)}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      margin-top:14px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(127,210,167,.18);
      background:rgba(12,20,16,.55);
      color:#a6c9bb;
      font-size:12px;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#f85149;box-shadow:0 0 0 4px rgba(248,81,73,.10)}
    .dot.ok{background:#4caf50;box-shadow:0 0 0 4px rgba(76,175,80,.12)}
    .spin{
      width:14px;height:14px;border-radius:50%;
      border:2px solid rgba(255,255,255,.22);
      border-top-color:#fff;
      animation:spin 1s linear infinite;
      display:none;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:420px){
      .icon{font-size:54px}
      h1{font-size:19px}
      button{flex:1}
    }
  </style>
</head>
<body>
  <div class="wrap" role="alertdialog" aria-live="assertive">
    <div class="icon" id="icon">📡</div>
    <h1 id="title">Connection lost</h1>
    <div class="msg" id="msg">FrogTalk can’t reach the server. Check your internet connection.</div>
    <div class="sub" id="sub"></div>
    <div class="actions">
      <button id="btnRetry" onclick="Offline.retry()"><span class="spin" id="spin"></span><span id="retryText">Retry now</span></button>
      <button class="secondary" onclick="Offline.switchNode()">Switch node</button>
      <button class="secondary" onclick="Offline.reloadApp()">Reload app</button>
    </div>
    <div class="pill" id="pill"><span class="dot" id="dot"></span><span id="pillText">Disconnected</span></div>
  </div>
  <script>
  (function(){
    const qs = new URLSearchParams(location.search || '');
    const reason = (qs.get('reason') || '').toLowerCase();
    const detail = qs.get('detail') || '';
    const isOffline = (qs.get('offline') === '1') || (typeof navigator !== 'undefined' && navigator.onLine === false);

    const $ = (id) => document.getElementById(id);
    const set = (id, text) => { const el=$(id); if (el) el.textContent = text; };

    function applyState(kind){
      if (kind === 'offline' || isOffline){
        set('icon','📡');
        set('title','You are offline');
        set('msg','Check your internet connection. FrogTalk will reconnect automatically.');
        set('pillText','Offline');
        const dot=$('dot'); if (dot){ dot.classList.remove('ok'); }
        set('sub', detail || 'Waiting for network…');
        return;
      }
      if (kind === 'crash'){
        set('icon','⚠️');
        set('title','App needs a refresh');
        set('msg','The webview crashed or got stuck. Reloading usually fixes it.');
        set('pillText','Needs reload');
        const dot=$('dot'); if (dot){ dot.classList.remove('ok'); }
        set('sub', detail || '');
        return;
      }
      set('icon','⚠️');
      set('title','Can’t reach FrogTalk');
      set('msg','The server is unreachable. This usually means your connection dropped or the server is restarting.');
      set('pillText','Disconnected');
      const dot=$('dot'); if (dot){ dot.classList.remove('ok'); }
      set('sub', detail || 'Try again, or switch to another node.');
    }

    applyState(reason || (isOffline ? 'offline' : 'server'));

    function setBusy(busy){
      const sp = $('spin');
      const btn = $('btnRetry');
      const txt = $('retryText');
      if (sp) sp.style.display = busy ? 'inline-block' : 'none';
      if (btn) btn.disabled = !!busy;
      if (txt) txt.textContent = busy ? 'Connecting…' : 'Retry now';
    }

    window.Offline = {
      retry: function(){
        setBusy(true);
        try {
          if (window.Android && typeof window.Android.offlineRetry === 'function') return window.Android.offlineRetry();
        } catch(_) {}
        try { location.href = '/app'; } catch(_) {}
      },
      switchNode: function(){
        try {
          if (window.Android && typeof window.Android.offlineSwitchNode === 'function') return window.Android.offlineSwitchNode();
        } catch(_) {}
      },
      reloadApp: function(){
        try {
          if (window.Android && typeof window.Android.offlineReloadApp === 'function') return window.Android.offlineReloadApp();
        } catch(_) {}
        try { location.reload(); } catch(_) {}
      }
    };

    window.addEventListener('online', () => {
      set('sub','Back online — retrying…');
      try { window.Offline.retry(); } catch(_) {}
    });
    window.addEventListener('offline', () => {
      applyState('offline');
    });

    // If native doesn't take over, re-enable button after a short grace.
    setTimeout(() => setBusy(false), 4500);
  })();
  </script>
</body>
</html>
